<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131824"/><stop offset="1" stop-color="#0f131c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#8247e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="#0a0d13"/>

  <!-- Header (same as portfolio) -->
  <rect x="24" y="20" width="30" height="30" rx="9" fill="url(#brand)"/>
  <circle cx="39" cy="35" r="4" fill="#fff"/>
  <text x="64" y="40" font-size="19" font-weight="600" fill="#e6ecff">RuDeFi</text>
  <text x="139" y="40" font-size="14" fill="#8691aa">— портфель по всем сетям</text>
  <rect x="1050" y="22" width="126" height="26" rx="13" fill="#1a2131" stroke="#232b3d"/>
  <circle cx="1066" cy="35" r="4" fill="#6ddf8e"/>
  <text x="1080" y="39" font-size="12" fill="#9aa5bd">0xA3b…9F2c</text>

  <!-- Tabs -->
  <g transform="translate(24, 72)" font-size="13">
    <text x="0" y="23" fill="#8691aa">Активы</text>
    <text x="80" y="23" fill="#8691aa">DeFi позиции</text>
    <rect x="195" y="0" width="100" height="36" rx="9" fill="#1a2131" stroke="#6ea8fe"/>
    <text x="245" y="23" text-anchor="middle" fill="#e6ecff" font-weight="500">Обмен</text>
    <text x="320" y="23" fill="#8691aa">Заработок</text>
    <text x="420" y="23" fill="#8691aa">Approvals</text>
    <text x="510" y="23" fill="#8691aa">Транзакции</text>
  </g>

  <!-- Form card -->
  <rect x="24" y="122" width="1152" height="420" rx="12" fill="url(#panel)" stroke="#232b3d"/>
  <text x="48" y="156" font-size="18" font-weight="600" fill="#e6ecff">Обмен токенов</text>
  <text x="190" y="156" font-size="12" fill="#8691aa">внутри одной сети (DEX-агрегатор) или между сетями (мосты) — через LiFi</text>

  <!-- Form fields -->
  <g transform="translate(48, 190)" font-size="12" fill="#8691aa">
    <!-- From -->
    <text x="0" y="0">ИЗ СЕТИ</text>
    <rect x="0" y="14" width="240" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <circle cx="22" cy="37" r="10" fill="#627eea"/>
    <text x="42" y="42" fill="#e6ecff" font-size="14">Ethereum</text>

    <text x="256" y="0">ТОКЕН</text>
    <rect x="256" y="14" width="200" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <circle cx="278" cy="37" r="10" fill="#2775ca"/>
    <text x="276" y="42" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">USDC</text>
    <text x="298" y="42" fill="#e6ecff" font-size="14">USDC</text>

    <text x="472" y="0">СУММА</text>
    <rect x="472" y="14" width="280" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <text x="490" y="44" fill="#e6ecff" font-size="18" font-family="ui-monospace,Menlo,monospace">5000</text>
    <text x="720" y="44" text-anchor="end" font-size="11" fill="#8691aa">MAX  ·  бал. 8 420 USDC</text>
  </g>

  <!-- Swap arrow -->
  <g transform="translate(600, 270)">
    <circle r="22" fill="url(#brand)"/>
    <text y="6" text-anchor="middle" font-size="22" fill="#fff">⇅</text>
  </g>

  <g transform="translate(48, 310)" font-size="12" fill="#8691aa">
    <text x="0" y="0">В СЕТЬ</text>
    <rect x="0" y="14" width="240" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <circle cx="22" cy="37" r="10" fill="#28a0f0"/>
    <text x="42" y="42" fill="#e6ecff" font-size="14">Arbitrum</text>

    <text x="256" y="0">ПОЛУЧУ</text>
    <rect x="256" y="14" width="200" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <circle cx="278" cy="37" r="10" fill="#627eea"/>
    <text x="276" y="42" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">WETH</text>
    <text x="298" y="42" fill="#e6ecff" font-size="14">WETH</text>

    <text x="472" y="0">НАПРАВИТЬ НА</text>
    <rect x="472" y="14" width="632" height="46" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <text x="492" y="42" fill="#8691aa" font-size="12" font-family="ui-monospace,Menlo,monospace">0xA3b7...A4f29F2c</text>
    <text x="1080" y="42" text-anchor="end" font-size="11" fill="#6ea8fe">этот же кошелёк ✓</text>
  </g>

  <!-- Quote button -->
  <rect x="48" y="400" width="200" height="46" rx="9" fill="url(#brand)"/>
  <text x="148" y="430" text-anchor="middle" font-size="14" font-weight="600" fill="#0a0d13">Получить котировку</text>

  <!-- Quote result -->
  <g transform="translate(48, 476)">
    <rect width="1104" height="52" rx="9" fill="rgba(109,223,142,0.08)" stroke="#6ddf8e"/>
    <text x="20" y="22" font-size="12" fill="#8691aa">ВЫ ПОЛУЧИТЕ</text>
    <text x="20" y="42" font-size="18" font-weight="700" fill="#6ddf8e">1.4587 WETH ≈ $4 992.15</text>
    <text x="280" y="22" font-size="12" fill="#8691aa">МАРШРУТ</text>
    <text x="280" y="42" font-size="13" fill="#e6ecff">Across Protocol → ~ 4 мин</text>
    <text x="520" y="22" font-size="12" fill="#8691aa">ГАЗ</text>
    <text x="520" y="42" font-size="13" fill="#e6ecff">$2.80 (0.00082 ETH)</text>
    <text x="700" y="22" font-size="12" fill="#8691aa">СЛИППАЖ</text>
    <text x="700" y="42" font-size="13" fill="#e6ecff">0.09%</text>
    <rect x="920" y="10" width="170" height="32" rx="7" fill="url(#brand)"/>
    <text x="1005" y="31" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">Выполнить обмен</text>
  </g>

  <!-- Status cards (secondary content) -->
  <g transform="translate(24, 562)" font-size="12">
    <rect width="568" height="110" rx="12" fill="url(#panel)" stroke="#232b3d"/>
    <text x="20" y="30" font-size="15" font-weight="600" fill="#e6ecff">Прошлые операции</text>
    <text x="20" y="60" fill="#6ddf8e">● 1.46 WETH @ Arbitrum</text>
    <text x="20" y="80" fill="#8691aa">Across  ·  3 мин назад  ·  tx 0x3f21…</text>

    <rect x="588" y="0" width="564" height="110" rx="12" fill="url(#panel)" stroke="#232b3d"/>
    <text x="608" y="30" font-size="15" font-weight="600" fill="#e6ecff">Как работают мосты?</text>
    <text x="608" y="56" fill="#8691aa">LiFi агрегирует 15+ мостов (Across, Hop, Stargate…)</text>
    <text x="608" y="76" fill="#8691aa">и выбирает лучший маршрут по цене+времени.</text>
  </g>

  <!-- Footer -->
  <text x="24" y="800" font-size="11" fill="#5c667e">API: GET /api/bridge/quote?from=…&amp;to=…  ·  LiFi routes 15+ bridges</text>
</svg>
