<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131824"/><stop offset="1" stop-color="#0f131c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#8247e5"/>
    </linearGradient>
    <linearGradient id="chipAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(110,168,254,0.25)"/>
      <stop offset="1" stop-color="rgba(130,71,229,0.18)"/>
    </linearGradient>
  </defs>

  <!-- iPhone frame -->
  <rect x="0" y="0" width="420" height="870" rx="48" fill="#000"/>
  <rect x="10" y="10" width="400" height="850" rx="40" fill="#0a0d13"/>

  <!-- Notch -->
  <rect x="155" y="18" width="110" height="28" rx="14" fill="#000"/>

  <!-- Status bar -->
  <text x="40" y="38" font-size="12" fill="#fff" font-weight="600">09:41</text>
  <g transform="translate(340, 28)">
    <rect x="0" y="4" width="18" height="10" rx="2" fill="none" stroke="#fff"/>
    <rect x="2" y="6" width="14" height="6" fill="#fff"/>
    <circle cx="24" cy="9" r="3" fill="#fff"/>
    <rect x="32" y="4" width="20" height="10" rx="2" fill="#fff"/>
  </g>

  <!-- Content starts -->
  <g transform="translate(20, 70)">
    <!-- Header -->
    <rect x="0" y="0" width="30" height="30" rx="9" fill="url(#brand)"/>
    <circle cx="15" cy="15" r="4" fill="#fff"/>
    <text x="44" y="20" font-size="17" font-weight="600" fill="#e6ecff">RuDeFi</text>
    <text x="330" y="20" text-anchor="end" font-size="11" fill="#9aa5bd">●  0xA3b…9F2c</text>

    <!-- Connect button + input (stacked) -->
    <rect x="0" y="50" width="380" height="40" rx="9" fill="url(#brand)"/>
    <text x="190" y="75" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0d13">Подключить MetaMask</text>

    <rect x="0" y="98" width="380" height="40" rx="9" fill="#1a2131" stroke="#232b3d"/>
    <text x="12" y="124" font-size="12" fill="#e6ecff" font-family="ui-monospace,Menlo,monospace">0xA3b7...A4f29F2c</text>

    <!-- Wallet pills row -->
    <g transform="translate(0, 156)" font-size="11">
      <rect x="0" y="0" width="100" height="24" rx="12" fill="url(#chipAccent)" stroke="#6ea8fe"/>
      <circle cx="12" cy="12" r="5" fill="#6ea8fe"/>
      <text x="22" y="16" fill="#e6ecff">Основной</text>

      <rect x="110" y="0" width="100" height="24" rx="12" fill="#1a2131" stroke="#232b3d"/>
      <circle cx="122" cy="12" r="5" fill="#ff6b6b"/>
      <text x="132" y="16" fill="#c0c7d9">Торговый</text>

      <rect x="220" y="0" width="100" height="24" rx="12" fill="#1a2131" stroke="#232b3d"/>
      <circle cx="232" cy="12" r="5" fill="#6ddf8e"/>
      <text x="242" y="16" fill="#c0c7d9">Холодный</text>
    </g>

    <!-- Total card (1 col on mobile) -->
    <rect x="0" y="196" width="380" height="76" rx="12" fill="url(#panel)" stroke="#232b3d"/>
    <text x="16" y="218" font-size="10" fill="#8691aa" letter-spacing="0.7">ОБЩЕЕ (USD)</text>
    <text x="16" y="248" font-size="24" font-weight="700" fill="#e6ecff">$ 48 215.72</text>
    <text x="364" y="248" text-anchor="end" font-size="13" fill="#8691aa">₽ 4.52М</text>

    <!-- Tabs (horizontal scroll on mobile) -->
    <g transform="translate(0, 290)" font-size="12">
      <rect x="0" y="0" width="78" height="34" rx="7" fill="#1a2131" stroke="#6ea8fe"/>
      <text x="39" y="22" text-anchor="middle" fill="#e6ecff" font-weight="500">Активы</text>
      <text x="94" y="22" fill="#8691aa">DeFi</text>
      <text x="140" y="22" fill="#8691aa">Обмен</text>
      <text x="200" y="22" fill="#8691aa">Yield</text>
      <text x="248" y="22" fill="#8691aa">Appr</text>
      <text x="296" y="22" fill="#8691aa">TXs</text>
    </g>

    <!-- Idle banner -->
    <rect x="0" y="340" width="380" height="56" rx="10" fill="rgba(255,169,77,0.08)" stroke="#f1b847"/>
    <text x="12" y="366" font-size="14">💸</text>
    <text x="32" y="358" font-size="11" fill="#e6ecff">
      <tspan font-weight="700">$12 450</tspan> валяются без работы
    </text>
    <text x="32" y="372" font-size="11" fill="#6ddf8e">+$42/мес (~3 940 ₽)</text>
    <text x="32" y="385" font-size="10" fill="#8691aa">нажми Заработок →</text>

    <!-- Holdings card -->
    <rect x="0" y="416" width="380" height="430" rx="12" fill="url(#panel)" stroke="#232b3d"/>

    <!-- Row 1 ETH -->
    <g transform="translate(16, 450)">
      <circle cx="14" cy="14" r="14" fill="#627eea"/>
      <text x="14" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">ETH</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#e6ecff">ETH</text>
      <text x="38" y="26" font-size="10" fill="#8691aa">Ethereum · 8.42</text>
      <text x="350" y="12" text-anchor="end" font-size="13" fill="#e6ecff">$ 28 793</text>
      <text x="350" y="26" text-anchor="end" font-size="10" fill="#8691aa">59.7%</text>
    </g>

    <line x1="16" y1="500" x2="364" y2="500" stroke="#232b3d" stroke-opacity="0.5"/>

    <!-- Row 2 USDC -->
    <g transform="translate(16, 522)">
      <circle cx="14" cy="14" r="14" fill="#2775ca"/>
      <text x="14" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">USDC</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#e6ecff">USDC</text>
      <text x="38" y="26" font-size="10" fill="#8691aa">Arbitrum · 8 420.00</text>
      <text x="350" y="12" text-anchor="end" font-size="13" fill="#e6ecff">$ 8 420</text>
      <text x="350" y="26" text-anchor="end" font-size="10" fill="#8691aa">17.5%</text>
    </g>

    <line x1="16" y1="572" x2="364" y2="572" stroke="#232b3d" stroke-opacity="0.5"/>

    <!-- Row 3 WBTC -->
    <g transform="translate(16, 594)">
      <circle cx="14" cy="14" r="14" fill="#f7931a"/>
      <text x="14" y="19" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">WBTC</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#e6ecff">WBTC</text>
      <text x="38" y="26" font-size="10" fill="#8691aa">Base · 0.12</text>
      <text x="350" y="12" text-anchor="end" font-size="13" fill="#e6ecff">$ 8 184</text>
      <text x="350" y="26" text-anchor="end" font-size="10" fill="#8691aa">17.0%</text>
    </g>

    <line x1="16" y1="644" x2="364" y2="644" stroke="#232b3d" stroke-opacity="0.5"/>

    <!-- Row 4 OP -->
    <g transform="translate(16, 666)">
      <circle cx="14" cy="14" r="14" fill="#ff0420"/>
      <text x="14" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">OP</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#e6ecff">OP</text>
      <text x="38" y="26" font-size="10" fill="#8691aa">Optimism · 820.5</text>
      <text x="350" y="12" text-anchor="end" font-size="13" fill="#e6ecff">$ 1 755</text>
      <text x="350" y="26" text-anchor="end" font-size="10" fill="#8691aa">3.6%</text>
    </g>

    <line x1="16" y1="716" x2="364" y2="716" stroke="#232b3d" stroke-opacity="0.5"/>

    <!-- Row 5 POL -->
    <g transform="translate(16, 738)">
      <circle cx="14" cy="14" r="14" fill="#8247e5"/>
      <text x="14" y="19" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">POL</text>
      <text x="38" y="12" font-size="14" font-weight="600" fill="#e6ecff">POL</text>
      <text x="38" y="26" font-size="10" fill="#8691aa">Polygon · 2 142.00</text>
      <text x="350" y="12" text-anchor="end" font-size="13" fill="#e6ecff">$ 1 062</text>
      <text x="350" y="26" text-anchor="end" font-size="10" fill="#8691aa">2.2%</text>
    </g>

    <line x1="16" y1="788" x2="364" y2="788" stroke="#232b3d" stroke-opacity="0.5"/>

    <text x="190" y="818" text-anchor="middle" font-size="11" fill="#8691aa">+ 9 активов на $0.9k</text>
  </g>

  <!-- Home indicator -->
  <rect x="140" y="844" width="140" height="4" rx="2" fill="#444"/>
</svg>
