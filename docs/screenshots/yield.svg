<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131824"/><stop offset="1" stop-color="#0f131c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#8247e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="#0a0d13"/>

  <!-- Header -->
  <rect x="24" y="20" width="30" height="30" rx="9" fill="url(#brand)"/>
  <circle cx="39" cy="35" r="4" fill="#fff"/>
  <text x="64" y="40" font-size="19" font-weight="600" fill="#e6ecff">RuDeFi</text>
  <text x="139" y="40" font-size="14" fill="#8691aa">— портфель по всем сетям</text>

  <!-- Tabs -->
  <g transform="translate(24, 72)" font-size="13">
    <text x="0" y="23" fill="#8691aa">Активы</text>
    <text x="80" y="23" fill="#8691aa">DeFi позиции</text>
    <text x="195" y="23" fill="#8691aa">Обмен</text>
    <rect x="270" y="0" width="120" height="36" rx="9" fill="#1a2131" stroke="#6ea8fe"/>
    <text x="330" y="23" text-anchor="middle" fill="#e6ecff" font-weight="500">Заработок</text>
    <text x="420" y="23" fill="#8691aa">Approvals</text>
    <text x="510" y="23" fill="#8691aa">Транзакции</text>
  </g>

  <!-- Filters card -->
  <rect x="24" y="122" width="1152" height="106" rx="12" fill="url(#panel)" stroke="#232b3d"/>
  <text x="48" y="156" font-size="18" font-weight="600" fill="#e6ecff">Поиск пулов</text>
  <text x="190" y="156" font-size="12" fill="#8691aa">DeFiLlama · только безопасные (TVL &gt; $5M, нет IL-риска)</text>

  <!-- Filter chips -->
  <g transform="translate(48, 180)" font-size="12">
    <rect width="140" height="32" rx="7" fill="#1a2131" stroke="#232b3d"/>
    <text x="12" y="20" fill="#8691aa">токены:</text>
    <text x="60" y="20" fill="#e6ecff">USDC, USDT</text>

    <rect x="156" width="130" height="32" rx="7" fill="#1a2131" stroke="#232b3d"/>
    <text x="168" y="20" fill="#8691aa">min TVL:</text>
    <text x="220" y="20" fill="#e6ecff">$5M</text>

    <rect x="302" width="130" height="32" rx="7" fill="#1a2131" stroke="#232b3d"/>
    <text x="314" y="20" fill="#8691aa">min APY:</text>
    <text x="372" y="20" fill="#e6ecff">4%</text>

    <rect x="448" width="140" height="32" rx="7" fill="#132135" stroke="#6ea8fe"/>
    <text x="460" y="20" fill="#e6ecff">✓ только стейблы</text>

    <rect x="604" width="140" height="32" rx="7" fill="#132135" stroke="#6ea8fe"/>
    <text x="616" y="20" fill="#e6ecff">✓ без IL</text>

    <rect x="990" width="160" height="32" rx="7" fill="url(#brand)"/>
    <text x="1070" y="21" text-anchor="middle" fill="#0a0d13" font-weight="600">Обновить</text>
  </g>

  <!-- Pool list card -->
  <rect x="24" y="248" width="1152" height="548" rx="12" fill="url(#panel)" stroke="#232b3d"/>

  <!-- Column headers -->
  <g font-size="11" fill="#8691aa" letter-spacing="0.6">
    <text x="46" y="286">ПРОЕКТ</text>
    <text x="300" y="286">ПУЛ</text>
    <text x="620" y="286">СЕТЬ</text>
    <text x="820" y="286" text-anchor="end">TVL</text>
    <text x="960" y="286" text-anchor="end">APY</text>
    <text x="1152" y="286" text-anchor="end">30-ДНЕЙ СРЕДНИЙ</text>
  </g>
  <line x1="40" y1="298" x2="1152" y2="298" stroke="#232b3d"/>

  <!-- Row 1: Aave USDC Ethereum -->
  <g transform="translate(0, 338)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Aave V3</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">lending</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">USDC</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · no IL</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(98,126,234,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#627eea"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Ethereum</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$2.4B</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">6.42%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">base 4.2 + reward 2.2</text>
    <text x="1152" y="0" text-anchor="end" font-size="13" fill="#c0c7d9">6.15%</text>
  </g>

  <line x1="40" y1="378" x2="1152" y2="378" stroke="#232b3d" stroke-opacity="0.5"/>

  <!-- Row 2: Compound USDT Arbitrum -->
  <g transform="translate(0, 418)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Compound V3</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">lending</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">USDT</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · no IL</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(40,160,240,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#28a0f0"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Arbitrum</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$320M</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">5.84%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">base 3.1 + reward 2.74</text>
