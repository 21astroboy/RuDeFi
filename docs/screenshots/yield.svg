  <line x1="40" y1="458" x2="1152" y2="458" stroke="#232b3d" stroke-opacity="0.5"/>

  <!-- Row 3: Spark DAI Ethereum -->
  <g transform="translate(0, 498)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Spark</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">lending</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">DAI (sDAI)</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · no IL</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(98,126,234,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#627eea"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Ethereum</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$1.8B</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">5.00%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">MakerDAO DSR</text>
    <text x="1152" y="0" text-anchor="end" font-size="13" fill="#c0c7d9">5.00%</text>
  </g>

  <line x1="40" y1="538" x2="1152" y2="538" stroke="#232b3d" stroke-opacity="0.5"/>

  <!-- Row 4: Aave USDC Polygon -->
  <g transform="translate(0, 578)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Aave V3</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">lending</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">USDC</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · no IL</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(130,71,229,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#8247e5"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Polygon</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$95M</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">4.72%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">base 2.9 + reward 1.82</text>
    <text x="1152" y="0" text-anchor="end" font-size="13" fill="#c0c7d9">4.60%</text>
  </g>

  <line x1="40" y1="618" x2="1152" y2="618" stroke="#232b3d" stroke-opacity="0.5"/>

  <!-- Row 5: Fluid USDC Base -->
  <g transform="translate(0, 658)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Fluid</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">lending</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">USDC</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · no IL</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(0,82,255,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#0052ff"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Base</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$45M</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">4.21%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">base 2.4 + reward 1.81</text>
    <text x="1152" y="0" text-anchor="end" font-size="13" fill="#c0c7d9">4.05%</text>
  </g>

  <line x1="40" y1="698" x2="1152" y2="698" stroke="#232b3d" stroke-opacity="0.5"/>

  <!-- Row 6: Pendle sUSDe -->
  <g transform="translate(0, 738)">
    <text x="46" y="0" font-size="14" font-weight="600" fill="#e6ecff">Pendle</text>
    <text x="46" y="18" font-size="11" fill="#8691aa">fixed yield</text>
    <text x="300" y="0" font-size="14" fill="#e6ecff">sUSDe PT (28d)</text>
    <text x="300" y="18" font-size="11" fill="#8691aa">single · stable · fixed</text>
    <rect x="620" y="-16" width="130" height="22" rx="11" fill="#1a2131" stroke="rgba(98,126,234,0.2)"/>
    <circle cx="632" cy="-5" r="8" fill="#627eea"/>
    <text x="644" y="-1" font-size="12" fill="#c0c7d9">Ethereum</text>
    <text x="820" y="0" text-anchor="end" font-size="14" fill="#e6ecff">$180M</text>
    <text x="960" y="0" text-anchor="end" font-size="18" font-weight="700" fill="#6ddf8e">10.80%</text>
    <text x="960" y="18" text-anchor="end" font-size="10" fill="#8691aa">fixed APY до maturity</text>
    <text x="1152" y="0" text-anchor="end" font-size="13" fill="#c0c7d9">—</text>
  </g>
</svg>
