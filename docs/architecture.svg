<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8fe"/><stop offset="1" stop-color="#8247e5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131824"/><stop offset="1" stop-color="#0f131c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ea8fe"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ddf8e"/>
    </marker>
  </defs>

  <rect width="1200" height="820" fill="#0a0d13"/>

  <!-- Title -->
  <text x="600" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#e6ecff">RuDeFi — Architecture</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#8691aa">Stateless C++ backend + static PWA · multichain data from public RPCs and open APIs</text>

  <!-- Tier 1: Client -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="110" rx="14" fill="url(#panel)" stroke="#6ea8fe" stroke-opacity="0.4"/>
    <text x="24" y="30" font-size="11" fill="#6ea8fe" letter-spacing="1">CLIENT · browser / PWA / MetaMask mobile</text>

    <!-- browser desktop -->
    <g transform="translate(40, 50)">
      <rect width="200" height="40" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="19" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="500">Browser (desktop)</text>
      <text x="100" y="33" text-anchor="middle" font-size="10" fill="#8691aa">MetaMask extension</text>
    </g>
    <!-- PWA -->
    <g transform="translate(280, 50)">
      <rect width="200" height="40" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="19" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="500">PWA (iOS / Android)</text>
      <text x="100" y="33" text-anchor="middle" font-size="10" fill="#8691aa">manifest + service worker</text>
    </g>
    <!-- MetaMask mobile -->
    <g transform="translate(520, 50)">
      <rect width="200" height="40" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="19" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="500">MetaMask Mobile</text>
      <text x="100" y="33" text-anchor="middle" font-size="10" fill="#8691aa">in-app browser</text>
    </g>
    <!-- CSV / localStorage -->
    <g transform="translate(760, 50)">
      <rect width="200" height="40" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="19" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="500">localStorage</text>
      <text x="100" y="33" text-anchor="middle" font-size="10" fill="#8691aa">wallet book · CSV export</text>
    </g>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="214" x2="600" y2="254" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="236" font-size="11" fill="#8691aa">HTTPS</text>

  <!-- Tier 2: Nginx -->
  <g transform="translate(300, 258)">
    <rect width="600" height="76" rx="14" fill="url(#panel)" stroke="#6ea8fe" stroke-opacity="0.5"/>
    <text x="24" y="26" font-size="11" fill="#6ea8fe" letter-spacing="1">EDGE</text>
    <text x="24" y="52" font-size="15" fill="#e6ecff" font-weight="600">nginx (443)</text>
    <text x="24" y="68" font-size="11" fill="#8691aa">reverse proxy · HTTP→HTTPS · Let's Encrypt · rate-limit 20 r/s</text>
    <rect x="430" y="22" width="150" height="38" rx="8" fill="#1a2131" stroke="#232b3d"/>
    <text x="505" y="46" text-anchor="middle" font-size="12" fill="#e6ecff">SSL cert (90d renew)</text>
  </g>

  <!-- Arrow down -->
  <line x1="600" y1="338" x2="600" y2="378" stroke="#6ea8fe" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="620" y="360" font-size="11" fill="#8691aa">HTTP (docker net)</text>

  <!-- Tier 3: C++ Backend -->
  <g transform="translate(100, 382)">
    <rect width="1000" height="200" rx="14" fill="url(#panel)" stroke="url(#brand)" stroke-width="1.5"/>
    <text x="24" y="26" font-size="11" fill="#8247e5" letter-spacing="1">CRYPTOAPP C++ BACKEND (port 8787)</text>
    <text x="24" y="52" font-size="15" fill="#e6ecff" font-weight="600">stateless · no DB · ~70 MB RAM · 1 vCPU</text>

    <!-- Endpoint grid -->
    <g font-size="11">
      <!-- row 1 -->
      <rect x="24"  y="76" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="36"  y="92" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/scan</text>
      <text x="36"  y="106" fill="#8691aa">11 chains · holdings · DeFi</text>

      <rect x="258" y="76" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="270" y="92" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/bridge/quote</text>
      <text x="270" y="106" fill="#8691aa">LiFi · 15+ bridges</text>

      <rect x="492" y="76" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="504" y="92" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/yield/scan</text>
      <text x="504" y="106" fill="#8691aa">DeFiLlama · 10k+ pools</text>

      <rect x="726" y="76" width="250" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="738" y="92" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/approvals</text>
      <text x="738" y="106" fill="#8691aa">ERC-20 approvals + GoPlus check</text>

      <!-- row 2 -->
      <rect x="24"  y="122" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="36"  y="138" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/gas</text>
      <text x="36"  y="152" fill="#8691aa">live gas snapshot</text>

      <rect x="258" y="122" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="270" y="138" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/registry</text>
      <text x="270" y="152" fill="#8691aa">chains + tokens for UI</text>

      <rect x="492" y="122" width="220" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="504" y="138" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/security/token</text>
      <text x="504" y="152" fill="#8691aa">GoPlus rug detector</text>

      <rect x="726" y="122" width="250" height="38" rx="7" fill="#1a2131" stroke="#232b3d"/>
      <text x="738" y="138" fill="#6ea8fe" font-family="ui-monospace,Menlo,monospace">GET /api/healthz</text>
      <text x="738" y="152" fill="#8691aa">liveness for nginx</text>
    </g>
  </g>

  <!-- Arrows to data sources (fanning out) -->
  <line x1="340" y1="586" x2="220" y2="640" stroke="#6ddf8e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="500" y1="586" x2="440" y2="640" stroke="#6ddf8e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="700" y1="586" x2="700" y2="640" stroke="#6ddf8e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="900" y1="586" x2="960" y2="640" stroke="#6ddf8e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Tier 4: External data sources -->
  <g transform="translate(60, 650)">
    <rect width="1080" height="140" rx="14" fill="url(#panel)" stroke="#6ddf8e" stroke-opacity="0.4"/>
    <text x="24" y="30" font-size="11" fill="#6ddf8e" letter-spacing="1">EXTERNAL · all free · all HTTPS</text>

    <g transform="translate(28, 56)">
      <!-- RPC -->
      <rect width="200" height="68" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="600">EVM RPCs</text>
      <text x="100" y="38" text-anchor="middle" font-size="10" fill="#8691aa">11 chains · multicall</text>
      <text x="100" y="52" text-anchor="middle" font-size="10" fill="#8691aa">(public + Alchemy opt.)</text>
    </g>

    <g transform="translate(248, 56)">
      <rect width="200" height="68" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="600">LiFi</text>
      <text x="100" y="38" text-anchor="middle" font-size="10" fill="#8691aa">bridge aggregator</text>
      <text x="100" y="52" text-anchor="middle" font-size="10" fill="#8691aa">li.quest/v1</text>
    </g>

    <g transform="translate(468, 56)">
      <rect width="200" height="68" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="600">CoinGecko</text>
      <text x="100" y="38" text-anchor="middle" font-size="10" fill="#8691aa">token prices</text>
      <text x="100" y="52" text-anchor="middle" font-size="10" fill="#8691aa">10 min cache</text>
    </g>

    <g transform="translate(688, 56)">
      <rect width="200" height="68" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="100" y="22" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="600">DeFiLlama</text>
      <text x="100" y="38" text-anchor="middle" font-size="10" fill="#8691aa">yield pools</text>
      <text x="100" y="52" text-anchor="middle" font-size="10" fill="#8691aa">yields.llama.fi</text>
    </g>

    <g transform="translate(908, 56)">
      <rect width="144" height="68" rx="9" fill="#1a2131" stroke="#232b3d"/>
      <text x="72" y="22" text-anchor="middle" font-size="13" fill="#e6ecff" font-weight="600">CBR + GoPlus</text>
      <text x="72" y="38" text-anchor="middle" font-size="10" fill="#8691aa">RUB rate + rug</text>
      <text x="72" y="52" text-anchor="middle" font-size="10" fill="#8691aa">cbr.ru · goplus</text>
    </g>
  </g>

  <!-- Side note: client-side only path -->
  <g transform="translate(950, 100)">
    <text x="0" y="140" font-size="11" fill="#8691aa">— — —</text>
    <text x="0" y="156" font-size="11" fill="#f1b847">Etherscan V2</text>
    <text x="0" y="170" font-size="10" fill="#8691aa">(client-side, user's key)</text>
    <text x="0" y="184" font-size="10" fill="#8691aa">— — —</text>
  </g>
</svg>
