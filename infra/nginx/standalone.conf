# Snippet для твоего существующего nginx.
#
# Куда положить (на Ubuntu/Debian с стандартной структурой):
#   sudo cp nginx-snippet.conf /etc/nginx/sites-available/rudefi
#   sudo ln -s /etc/nginx/sites-available/rudefi /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Что меняет:
#   • Заменить SERVER_NAME_HERE на свой домен или путь (см. варианты ниже)
#   • Если ставишь по пути (а не на отдельный поддомен), раскомментировать
#     блок `location /rudefi/` вместо верхнего server block.

# ВАРИАНТ A: отдельный поддомен rudefi.твой.домен
# Сначала добавь A-запись в DNS: rudefi → IP VPS.
# Потом добавь сертификат: sudo certbot --nginx -d rudefi.твой.домен
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME_HERE;    # например rudefi.algoclimb.ru

    # Certbot сам добавит SSL-блок после certbot --nginx -d ...

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}

# ВАРИАНТ B: подпуть на существующем домене (НЕ рекомендую — PWA manifest
# и service worker ломаются на non-root paths)
#
# В существующий server {} блок добавить:
