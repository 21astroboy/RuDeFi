# HTTP → редирект на HTTPS (кроме ACME-challenge для certbot).
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Let's Encrypt validation
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS — основной сервер.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name _;

  # SSL (Let's Encrypt подкладывает после certbot certonly)
  ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers on;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;

  limit_req zone=api_global burst=60 nodelay;
  limit_conn connections 30;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # CSP слабый — внутри uses inline <script> и внешние иконки, пришлось разрешить.
  add_header Content-Security-Policy "default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https: wss:;" always;

  # API — проксируем в бэкенд, лимитим rate
  location /api/ {
    limit_req zone=api burst=10 nodelay;
    limit_req zone=api_global burst=30 nodelay;
    limit_req zone=expensive burst=6 nodelay;
    limit_conn connections 20;
    limit_conn expensive_connections 2;
    limit_conn expensive_total 6;
    limit_except GET { deny all; }
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;
    proxy_buffering off;
  }

  # Health bypasses expensive-route limits, but still reaches the backend.
  location = /api/healthz {
    access_log off;
    proxy_pass http://app:8787;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
  }

  # Статика с длинным кэшем (service worker её сам обновит через SW cache)
  location ~* \.(svg|png|jpg|jpeg|webp|ico|woff2?)$ {
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Service worker — короткий кэш, иначе юзер не получит апдейты
  location = /sw.js {
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
  }

  # Manifest — короткий кэш
  location = /manifest.webmanifest {
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }

  # Всё остальное (index.html + отдача UI) — короткий кэш
  location / {
    proxy_pass http://app:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-cache";
  }
}
