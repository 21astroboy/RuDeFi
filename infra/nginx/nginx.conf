user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  10;
  keepalive_requests 100;
  client_header_timeout 10s;
  client_body_timeout 10s;
  send_timeout 15s;
  client_max_body_size 16k;
  reset_timedout_connection on;
  server_tokens off;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json image/svg+xml;

  # Limits use the TCP peer address. Never trust arbitrary X-Forwarded-For.
  map $uri $expensive_ip {
    default "";
    ~^/api/(scan|approvals|yield/scan|bridge/(quote|build-tx))$ $binary_remote_addr;
  }
  map $expensive_ip $expensive_global {
    "" "";
    default rudefi;
  }
  limit_req_zone $binary_remote_addr zone=api:10m rate=3r/s;
  limit_req_zone $server_name zone=api_global:1m rate=20r/s;
  limit_req_zone $expensive_ip zone=expensive:10m rate=12r/m;
  limit_conn_zone $binary_remote_addr zone=connections:10m;
  limit_conn_zone $expensive_ip zone=expensive_connections:10m;
  limit_conn_zone $expensive_global zone=expensive_total:1m;
  limit_req_status 429;
  limit_conn_status 429;
  limit_req_log_level warn;

  include /etc/nginx/conf.d/*.conf;
}
